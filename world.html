<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>世界カードUI</title>
  <link rel="stylesheet" href="world.css" />
</head>
<body>
  <div class="world-page">
    <aside class="scenario-list">
      <div class="list-head">
        <strong>シナリオリスト</strong>
        <button type="button" id="worldAddButton">追加</button>
        
      </div>
      <p>クリックすると<br>内容呼び出し</p>
      <div id="worldList"></div>

    </aside>

    <main class="world-main">
      <section class="world-title">
        <div class="title-stack">
          <label>
            <span class="form-label">世界ID</span>
            <input id="worldIdInput" type="text" />
            <span>リストの表示順や処理で使用します。</span>
            <span id="worldIdError" class="error-message"></span>
          </label>

          <label>
            <span class="form-label">世界名</span>
            <input id="worldNameInput" type="text" />
            <span>ここの名前で世界設定を表示します。</span>
            <span id="worldNameError" class="error-message"></span>
          </label>
        </div>
      </section>

      <section class="world-grid">
        <div class="box participants-box">
          <div class="box-header">
            <strong>登場人物</strong>
            <button type="button" id="reflectParticipantsButton">隣のyaml内容を反映</button>
          </div>

          <div class="participant-panel">
            <div class="participant-header">
              <div>名前</div>
              <div>役割</div>
            </div>

            <div class="participant-body">
            </div>
          </div>
        </div>

        <div class="box participants-yaml-box">
          <div class="box-header header-with-error">
            <div class="header-line">
              <strong>登場人物</strong>
              <button type="button" id="initIncludePlayerYamlButton">初期化</button>
              <button type="button">追加</button>
            </div>
            <span id="includeError" class="error-message"></span>
          </div>
          <textarea id="worldIncludePlayerYaml" spellcheck="false"></textarea>
        </div>

        <div class="scenario-section">
          <div class="section-title">シナリオ</div>

          <label class="yaml-block">
            <span>過去</span>
            <span id="pastError" class="error-message"></span>
            <textarea id="pastInput"></textarea>
          </label>

          <label class="yaml-block">
            <span>現在</span>
            <span id="currentError" class="error-message"></span>
            <textarea id="currentInput"></textarea>
          </label>

          <label class="yaml-block">
            <span>未来</span>
            <span id="futureError" class="error-message"></span>
            <textarea id="futureInput"></textarea>
          </label>

          <div class="bottom-two">
            <label class="yaml-block">
              <span>目的</span>
              <span id="purposeError" class="error-message"></span>
              <textarea id="purposeInput"></textarea>
            </label>

            <label class="yaml-block">
              <span>補足</span>
              <span id="supplementError" class="error-message"></span>
              <textarea id="supplementInput"></textarea>
            </label>
          </div>
        </div>

        <div class="right-stack">
          <div class="box goal-box">
            <div class="box-header">
              <strong>シナリオの目標</strong>
              <button type="button" id="initGoalSettingYamlButton">初期化</button>
              <button type="button">追加</button>
              <span id="worldGoalError" class="error-message"></span>
            </div>
            <textarea id="worldGoalSettingYaml" spellcheck="false"></textarea>
          </div>

          <div class="box message-box">
            <div class="box-header">
              <strong>シナリオパラメータ</strong>
              <button type="button" id="initParameterSettingYamlButton">初期化</button>
              <button type="button">追加</button>
              <span id="worldParameterError" class="error-message"></span>
            </div>
            <textarea id="worldParameterSettingYaml" spellcheck="false"></textarea>
          </div>

          <div class="box params-box">
            <div class="box-header">
              <strong>開始メッセージ</strong>
              <span id="startMessageError" class="error-message"></span>
            </div>
            <textarea id="startMessageInput"></textarea>
          </div>
        </div>
      </section>

      <footer class="world-footer">
        <button type="button" id="worldDeleteButton">削除</button>
        <button type="button" id="saveWorldButton">登録／更新</button>
      </footer>
    </main>
  </div>
  <script src="js/constant.js"></script>
  <script src="js/common.js"></script>
  <script src="js/world.js"></script>
</body>
</html>
