<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>世界カードUI</title>
  <link rel="stylesheet" href="world.css" />
</head>
<body>
  <div class="world-page">
    <aside class="scenario-list">
      <div class="list-head">
        <strong>シナリオリスト</strong>
        <button type="button">追加</button>
      </div>
      <p>クリックすると<br />内容呼び出し</p>
      <button class="scenario-item active" type="button">カッコウ医院編</button>
    </aside>

    <main class="world-main">
      <header class="world-title">
        <label>
          <span>シナリオ名</span>
          <input type="text" value="カッコウ医院編" />
        </label>
      </header>

      <section class="world-grid">
        <section class="box participants-box">
          <div class="box-header">
            <strong>登場人物</strong>
            <button type="button">追加</button>
            <span>←アイコンと名前</span>
          </div>
          <table>
            <thead>
              <tr>
                <th>名前</th>
                <th>役割</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>黒羽 究也</td>
                <td>プレイヤー</td>
              </tr>
              <tr>
                <td>白井 結</td>
                <td>メイン</td>
              </tr>
              <tr>
                <td>白井 圭太</td>
                <td>サブ</td>
              </tr>
            </tbody>
          </table>
        </section>

        <section class="box goal-box">
          <div class="box-header">
            <strong>シナリオの目標</strong>
            <button type="button">初期化</button>
            <button type="button">追加</button>
          </div>
          <textarea spellcheck="false">goal:
  - target: シナリオ1
    use_flag: false
    checkpoint:
      - display_name: 条件1
        status: false
      - display_name: 条件2
        status: false</textarea>
        </section>

        <section class="box message-box">
          <div class="box-header">
            <strong>物語の開始メッセージ</strong>
          </div>
          <textarea spellcheck="false"></textarea>
        </section>

        <section class="scenario-section">
          <div class="section-title">シナリオ</div>

          <label class="yaml-block">
            <span>過去</span>
            <textarea spellcheck="false"></textarea>
          </label>

          <label class="yaml-block">
            <span>現在</span>
            <textarea spellcheck="false"></textarea>
          </label>

          <label class="yaml-block">
            <span>未来</span>
            <textarea spellcheck="false"></textarea>
          </label>

          <label class="yaml-block">
            <span>目的</span>
            <textarea spellcheck="false"></textarea>
          </label>

          <label class="yaml-block">
            <span>補足</span>
            <textarea spellcheck="false"></textarea>
          </label>
        </section>

        <section class="box params-box">
          <div class="box-header">
            <strong>シナリオパラメータ</strong>
            <button type="button">初期化</button>
            <button type="button">追加</button>
          </div>
          <textarea spellcheck="false">dynamic_params:
  - target: 白井 結
    param_data:
      - display_name: ユーザーへの好感度
        count: 0
      - display_name: 旦那への好感度
        count: 100</textarea>
        </section>
      </section>

      <footer class="world-footer">
        <button type="button">削除</button>
        <button type="button">登録／更新</button>
      </footer>
    </main>
  </div>
</body>
</html>
