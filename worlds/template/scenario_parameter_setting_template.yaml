# キャラクターIDは登録キャラカードのID
# リストに召喚済でないとエラーになる
# playerは変更しない事。処理で置換する
# サブやモブに対するパラメータも記載出来るので他は自由
# 負数許可は使わないならfalse
# ＋も－も一旦天井は設けない
# 増減幅は設定値分固定で増加するわけではなく、モデル判断でその範囲内で変動させる最大値
# 画像は/{LLM_CHAT_CONSOLE}/world/iconsに置いて、そのファイル名を記載する。使わないならnull
# 大きすぎてレイアウト崩れても責任持ちません
変動パラメータ:
  - 対象キャラクターID: shirai_yui
    パラメーター:
      - 表示名: playerへの好感度
        数値: 0
        増減幅: 10
        負数許可: true
        画像: null
      - 表示名: 白井　圭太への好感度
        数値: 100
        増減幅: 10
        負数許可: true
        画像: null
            