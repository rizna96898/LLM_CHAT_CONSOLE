<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>キャラクターカードUI</title>
  <link rel="stylesheet" href="character.css" />
</head>
<body>
  <div class="character-page">
    <aside class="character-list">
      <div class="list-head">
        <strong>キャラリスト</strong>
        <button type="button">追加</button>
      </div>
      <p>クリックすると<br />内容呼び出し</p>
      <button class="character-item active" type="button">白井 結</button>
    </aside>

    <main class="character-main">
      <header class="character-title">
        <div class="title-stack">
          <label>
            <span>キャラ名</span>
            <input type="text" value="白井 結" />
          </label>
          <div class="tag-row">
            <span class="tag-label-title">タグ</span>
            <button class="tag-action-button" type="button" id="openTagPicker">設定</button>
            <button class="tag-action-button" type="button">全削除</button>
            <span class="tag-chip">女子高生 <button type="button">×</button></span>
            <span class="tag-chip">学生 <button type="button">×</button></span>
          </div>
        </div>
      </header>

      <section class="character-grid">
        <section class="image-column">
          <section class="image-box icon-box">
            <div class="box-header">
              <strong>アイコン</strong>
              <button type="button">設定</button>
            </div>
            <div class="icon-preview">アイコン画像</div>
          </section>

          <section class="image-box standee-box">
            <div class="box-header">
              <strong>立ち絵</strong>
              <button type="button">設定</button>
            </div>
            <div class="standee-preview">立ち絵画像</div>
          </section>
        </section>

        <section class="settings-box">
          <div class="box-header">
            <strong>キャラクター設定</strong>
            <button type="button">初期化</button>
          </div>
          <textarea spellcheck="false">名前:
  表示名: 白井 結
  ふりがな: しらい ゆい
  識別子: shirai_yui

基本情報:
  性別: 女性
  年齢: 18
  職業: 女子高校生
  身長: 155cm

外見:
  髪:
    色: 黒髪
    長さ: 長髪
    髪型: ポニーテール
  体型:
    バスト: 99
    ブラジャーのカップサイズ: I
    ウエスト: 60
    ヒップ: 90

服装:
  通学時:
    - 学校指定のブレザー
    - ルーズソックス
    - ローファー
  私服:
    - ワンピース

好み:
  好きな色: 白

性格:
  基本:
    - 明るい
    - 親しみやすい
  会話傾向:
    - 状況に応じてトーンを調整する
    - 暗くならないが、軽くもしない
    - 親しい関係になると敬語は使わない

対人傾向:
  ユーザー: 未設定
</textarea>
        </section>

        <aside class="memo-box">
          <p>←スクロールバー必要</p>
          <p>←言語設定で言語UIにそのうちするようにする</p>
        </aside>
      </section>

      <footer class="character-footer">
        <button type="button">削除</button>
        <button type="button">登録／更新</button>
      </footer>
    </main>
  </div>
  <aside class="tag-picker-window hidden" id="tagPickerWindow">
    <div class="tag-picker-header">
      <strong>タグ選択</strong>
      <button type="button" id="closeTagPicker">×</button>
    </div>
    <div class="tag-picker-search">
      <input type="text" placeholder="タグ名でフィルター" />
    </div>
    <div class="tag-picker-body">
      <label><input type="checkbox" checked /> 女子高生</label>
      <label><input type="checkbox" checked /> 学生</label>
      <label><input type="checkbox" /> 医療</label>
      <label><input type="checkbox" /> 白井家</label>
      <label><input type="checkbox" /> メイン</label>
      <label><input type="checkbox" /> サブ</label>
    </div>
    <div class="tag-picker-footer">
      <button type="button">反映</button>
      <button type="button" id="closeTagPickerFooter">閉じる</button>
    </div>
  </aside>

  <script>
    const openTagPicker = document.getElementById('openTagPicker');
    const tagPickerWindow = document.getElementById('tagPickerWindow');
    const closeTagPicker = document.getElementById('closeTagPicker');
    const closeTagPickerFooter = document.getElementById('closeTagPickerFooter');

    openTagPicker.addEventListener('click', () => {
      tagPickerWindow.classList.toggle('hidden');
    });

    closeTagPicker.addEventListener('click', () => {
      tagPickerWindow.classList.add('hidden');
    });

    closeTagPickerFooter.addEventListener('click', () => {
      tagPickerWindow.classList.add('hidden');
    });
  </script>
</body>
</html>
