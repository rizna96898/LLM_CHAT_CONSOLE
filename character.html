<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>キャラクターカードUI</title>
  <link rel="stylesheet" href="./character.css">
</head>
<body>
  <div class="character-page">

    <aside class="character-list">
      <div class="list-head">
        <span>キャラリスト</span>
        <button id="addCharacterButton">追加</button>
      </div>
      <div id="characterListBody"></div>
    </aside>

    <main class="character-main">
      <header class="character-title">
        <div class="title-stack">
          <label>
            キャラクターID
            <input id="characterIdInput" type="text">
            <span>リストの表示順や処理で使用します。</span>
          </label>

          <label>
            キャラクター名
            <input id="characterNameInput" type="text">
            <span>ここの名前でチャットを行います。</span>
          </label>

          <div class="tag-row">
            <span class="tag-label-title">タグ</span>
            <button class="tag-action-button" id="tagSettingButton">設定</button>
            <button class="tag-action-button" id="tagClearButton">全削除</button>
            <span id="tagList"></span>
          </div>
        </div>
      </header>

      <section class="character-grid">

        <div class="image-column">
          <div class="image-box">
            <div class="box-header">
              <span>アイコン</span>
              <button>設定</button>
            </div>
            <div class="icon-preview">アイコン画像</div>
          </div>

          <div class="image-box">
            <div class="box-header">
              <span>立ち絵</span>
              <button>設定</button>
            </div>
            <div class="standee-preview">立ち絵画像</div>
          </div>
        </div>

        <div class="settings-box">
          <div class="box-header">
            <span>キャラクター設定</span>
            <button id="initializeButton">初期化</button>
          </div>
          <textarea id="characterSettingInput"></textarea>
        </div>
      </section>

      <footer class="character-footer">
        <button id="deleteButton">削除</button>
        <button id="saveButton">登録／更新</button>
      </footer>

    </main>
  </div>

  <script>
    const STORAGE_KEY = "char_list";

    let charList = [];
    let selectedId = null;

    const characterListBody = document.getElementById("characterListBody");
    const characterIdInput = document.getElementById("characterIdInput");
    const characterNameInput = document.getElementById("characterNameInput");
    const characterSettingInput = document.getElementById("characterSettingInput");
    const tagList = document.getElementById("tagList");

    function loadCharList() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        charList = Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        charList = [];
      }

      charList.sort((a, b) => String(a.id ?? "").localeCompare(String(b.id ?? "")));
    }

    function saveCharList() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(charList));
    }

    function createNewCharacter() {
      return {
        id: "new_character",
        name: "新しいキャラクター",
        tags: [],
        setting: ""
      };
    }

    function createUniqueId(baseId) {
      let id = baseId;
      let count = 2;

      while (charList.some(char => char.id === id)) {
        id = `${baseId}_${count}`;
        count++;
      }

      return id;
    }

    function getSelectedCharacter() {
      return charList.find(char => char.id === selectedId) ?? null;
    }

    function renderCharacterList() {
      characterListBody.innerHTML = "";

      for (const char of charList) {
        const button = document.createElement("button");
        button.className = "character-item";
        button.textContent = char.name || char.id || "名称未設定";

        if (char.id === selectedId) {
          button.classList.add("active");
        }

        button.addEventListener("click", () => {
          selectedId = char.id;
          renderCharacterList();
        });

        characterListBody.appendChild(button);
      }
    }

    function clearEditor() {
      characterIdInput.value = "";
      characterNameInput.value = "";
      characterSettingInput.value = "";
      tagList.innerHTML = "";
    }

    function renderEditor(char) {
      characterIdInput.value = char.id ?? "";
      characterNameInput.value = char.name ?? "";
      characterSettingInput.value = char.setting ?? "";
      renderTags(char.tags ?? []);
    }

    function renderTags(tags) {
      tagList.innerHTML = "";

      for (const tag of tags) {
        const span = document.createElement("span");
        span.className = "tag-chip";
        span.textContent = tag;
        tagList.appendChild(span);
      }
    }

    document.getElementById("addCharacterButton").addEventListener("click", () => {
      const newChar = createNewCharacter();
      newChar.id = createUniqueId(newChar.id);

      charList.push(newChar);
      selectedId = newChar.id;

      renderCharacterList();
      renderEditor(newChar);
    });

    document.getElementById("saveButton").addEventListener("click", () => {
      let char = getSelectedCharacter();

      if (!char) {
        char = createNewCharacter();
        char.id = createUniqueId(char.id);
        charList.push(char);
      }

      const oldId = char.id;

      char.id = characterIdInput.value.trim() || oldId || "new_character";
      char.name = characterNameInput.value.trim() || "新しいキャラクター";
      char.setting = characterSettingInput.value;

      selectedId = char.id;

      saveCharList();
      loadCharList();
      renderCharacterList();
      renderEditor(getSelectedCharacter() ?? createNewCharacter());
    });

    document.getElementById("deleteButton").addEventListener("click", () => {
      if (!selectedId) return;

      charList = charList.filter(char => char.id !== selectedId);
      selectedId = charList[0]?.id ?? null;

      saveCharList();
      renderCharacterList();

      const nextChar = getSelectedCharacter();
      renderEditor(nextChar ?? createNewCharacter());
    });

    document.getElementById("initializeButton").addEventListener("click", () => {
      characterSettingInput.value = "";
    });

    document.getElementById("tagClearButton").addEventListener("click", () => {
      const char = getSelectedCharacter();
      if (!char) return;

      char.tags = [];
      saveCharList();
      renderTags([]);
    });

    loadCharList();

    if (charList.length > 0) {
      selectedId = charList[0].id;
      renderEditor(charList[0]);
    } else {
      selectedId = null;
      clearEditor();   // ★ここ
    }

    renderCharacterList();
  </script>
</body>
</html>
