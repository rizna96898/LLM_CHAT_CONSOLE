<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>キャラクターカードUI</title>
  <link rel="stylesheet" href="./character.css?v=3">
</head>
<body>
  <div class="character-page">
    <aside class="character-list">
      <div class="list-head">
        <span>キャラリスト</span>
        <button id="addCharacterButton">追加</button>
      </div>
      <div id="characterListBody"></div>
    </aside>

    <main class="character-main">
      <header class="character-title">
        <div class="title-icon-area">
          <div class="icon-preview" id="iconPreview">
            <span class="placeholder">アイコン画像</span>
            <img id="iconImg">
          </div>
          <button type="button" id="iconSelectButton">設定</button>
          <input type="file" id="iconFileInput" accept="image/*" hidden>
        </div>

        <div class="title-stack">
          <label>
            <span class="form-label">キャラクターID</span>
            <input id="characterIdInput" type="text">
            <span>リストの表示順や処理で使用します。</span>
            <span id="idError" class="error-message"></span>
          </label>

          <label>
            <span class="form-label">キャラクター名</span>
            <input id="characterNameInput" type="text">
            <span>ここの名前でチャットを行います。</span>
            <span id="nameError" class="error-message"></span>
          </label>

          <div class="tag-row">
            <span class="tag-label-title">タグ</span>
            <button class="tag-action-button" id="tagSettingButton">設定</button>
            <button class="tag-action-button" id="tagClearButton">全削除</button>
            <span id="tagList"></span>
          </div>
        </div>
      </header>

      <section class="character-grid">
        <div class="image-box standee-box">
          <div class="box-header">
            <span class="form-label">立ち絵</span>
            <button type="button" id="standingSelectButton">設定</button>
            <input type="file" id="standingFileInput" accept="image/*" hidden>
          </div>

          <div class="standee-preview" id="standingPreview">
            <span class="placeholder">立ち絵画像</span>
            <img id="standingImg">
          </div>
        </div>

        <div class="settings-box">
          <div class="box-header">
            <span class="form-label">キャラクター設定</span>
            <button id="initializeButton">初期化</button>
            <span id="settingError" class="error-message"></span>
          </div>
          <textarea class="character-textarea" id="characterSettingInput"></textarea>
        </div>
      </section>

      <footer class="character-footer">
        <button id="deleteButton">削除</button>
        <button id="saveButton">登録／更新</button>
      </footer>
    </main>
  </div>


  <div id="iconCropOverlay" class="crop-overlay hidden">
    <div class="crop-window">
      <div class="crop-header">
        <strong>アイコン範囲指定</strong>
        <button type="button" id="iconCropCancelTop">×</button>
      </div>
      <div class="crop-body">
        <div class="crop-stage" id="iconCropStage">
          <img id="iconCropImage" alt="">
          <div class="crop-mask"></div>
          <div class="crop-frame"></div>
        </div>
        <div class="crop-controls">
          <label>
            拡大
            <input type="range" id="iconCropZoom" min="1" max="3" step="0.01" value="1">
          </label>
          <span>画像をドラッグして位置調整できます。</span>
        </div>
      </div>
      <div class="crop-footer">
        <button type="button" id="iconCropCancel">キャンセル</button>
        <button type="button" id="iconCropApply">OK</button>
      </div>
    </div>
  </div>
  <script src="character.js"></script>
</body>
</html>
